# Production docker-compose for Veakay backend.
#
# Usage:
#   1. Copy .env.production.example to .env and fill in all production values.
#   2. Run database migrations before first start (requires the build stage):
#      docker compose -f docker-compose.prod.yml run --rm app npx prisma migrate deploy
#   3. Start the stack:
#      docker compose -f docker-compose.prod.yml up -d
#
# See docs/07-docker-and-environments.md -> "Switching Dev to Production"
# and docs/DEVELOPMENT_FLOW.md for the full migration workflow.
#
# Hardening notes for a real production deployment:
#   - Remove the minio service and set S3_ENDPOINT to https://s3.amazonaws.com
#     (or your S3-compatible endpoint) to use real S3. No code changes needed.
#   - Remove exposed ports on postgres, redis, and minio if deploying to a
#     public host without a firewall -- keep only the app port (57800).
#   - Serve behind a reverse proxy (nginx/caddy) with TLS termination.
#   - The minio-init service runs once to create the S3 bucket. If you use real
#     S3, remove minio and minio-init and create the bucket in your S3 console.

name: veakay-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: veakay-prod-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums --auth-host=scram-sha-256"
    ports:
      - "${POSTGRES_PORT:-57432}:5432"
    volumes:
      - veakay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: veakay-prod-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --save 900 1 300 10 60 10000
      --loglevel warning
    env_file: .env
    ports:
      - "${REDIS_PORT:-57379}:6379"
    volumes:
      - veakay-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  minio:
    image: minio/minio:latest
    container_name: veakay-prod-minio
    restart: unless-stopped
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-57900}:9000"
      - "${MINIO_CONSOLE_PORT:-57901}:9001"
    volumes:
      - veakay-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  minio-init:
    image: minio/mc:latest
    container_name: veakay-prod-minio-init
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb -p local/${S3_BUCKET} || echo 'Bucket already exists';
      mc anonymous set public local/${S3_BUCKET}/public || true;
      echo 'MinIO bucket initialized.'
      "
    networks:
      - backend

  app:
    build:
      context: .
      target: runtime
    container_name: veakay-prod-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      S3_ENDPOINT: ${S3_ENDPOINT}
      PORT: ${PORT:-57800}
    ports:
      - "${PORT:-57800}:57800"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:57800/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  veakay-postgres-data:
    name: veakay-prod-postgres-data
  veakay-redis-data:
    name: veakay-prod-redis-data
  veakay-minio-data:
    name: veakay-prod-minio-data